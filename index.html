<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>副業・個人開発 統合ダッシュボード</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary:  #4cd964;
      --accent:   #00f2fe;
      --accent2:  #4facfe;
      --danger:   #ff2d55;
      --warning:  #ffcc00;
      --card:     rgba(255,255,255,0.06);
      --card-ft:  rgba(79,172,254,0.07);
      --border:   rgba(255,255,255,0.12);
      --border-ft:rgba(79,172,254,0.4);
      --text:     #ffffff;
      --sub:      #a0a0b0;
    }
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0; padding: 24px 16px 60px;
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background: linear-gradient(135deg, #0a0c18, #14172a);
      color: var(--text); min-height: 100vh;
    }
    .container { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

    /* Header */
    .hd { text-align: center; padding: 4px 0 8px; }
    h1 { margin: 0; font-size: 1.85rem;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hd-sub { color: var(--sub); font-size: .84rem; margin-top: 5px; }
    .hd-upd { color: rgba(160,160,176,.45); font-size: .72rem; margin-top: 3px; }

    /* Cards */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; }
    .card.ft { background: var(--card-ft); border-color: var(--border-ft); box-shadow: 0 0 40px rgba(79,172,254,.08); }
    h2 { margin: 0 0 14px; font-size: 1.05rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    h3 { margin: 16px 0 8px; font-size: .82rem; color: var(--accent); letter-spacing: .6px; text-transform: uppercase; }

    /* Badges / Priority */
    .badge { font-size: .68rem; padding: 3px 9px; border-radius: 20px; font-weight: 700; white-space: nowrap; }
    .run  { background: rgba(76,217,100,.18); color: var(--primary); }
    .plan { background: rgba(255,204,0,.18);  color: var(--warning); }
    .pend { background: rgba(255,45,85,.18);  color: var(--danger);  }
    .ph { color: #ff6b7a; font-size: .7rem; font-weight: 700; white-space: nowrap; }
    .pm { color: #ffd166; font-size: .7rem; font-weight: 700; white-space: nowrap; }
    .pl { color: #4cd964; font-size: .7rem; font-weight: 700; white-space: nowrap; }
    .pf { color: var(--sub); font-size: .7rem; white-space: nowrap; }

    /* Status dot */
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .dt { background: rgba(255,255,255,.25); }
    .dd { background: #ffd166; }
    .dn { background: var(--primary); }
    .df { background: rgba(255,255,255,.12); }

    /* Progress bar */
    .pb { height: 5px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; margin-top: 7px; }
    .pf-bar { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 4px; }

    /* Buttons */
    a.btn { text-decoration: none; color: #fff; background: rgba(255,255,255,.1);
      padding: 5px 11px; border-radius: 7px; font-size: .75rem; border: 1px solid var(--border); white-space: nowrap; }
    a.btn:hover { background: rgba(255,255,255,.18); }
    a.btn.ac { background: rgba(79,172,254,.14); border-color: rgba(79,172,254,.4); color: var(--accent); }
    .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    /* Meta row */
    .meta { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .meta-label { font-size: .75rem; color: var(--sub); white-space: nowrap; }
    .meta-bar { flex: 1; }
    .pct { font-size: .7rem; color: var(--sub); margin-top: 2px; }

    /* Completed list */
    ul.done-list { list-style: none; padding: 0; margin: 0; }
    ul.done-list li { font-size: .82rem; color: var(--sub); padding: 3px 0; display: flex; gap: 7px; }
    ul.done-list li::before { content: "✓"; color: var(--primary); font-weight: 700; flex-shrink: 0; }

    /* WBS Accordion */
    .acc { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
    .acc-hd { display: flex; align-items: center; justify-content: space-between;
      padding: 9px 14px; cursor: pointer; background: rgba(255,255,255,.03); user-select: none; }
    .acc-hd:hover { background: rgba(255,255,255,.06); }
    .acc-title { font-weight: 600; font-size: .85rem; display: flex; align-items: center; gap: 6px; }
    .arr { color: var(--sub); font-size: .7rem; transition: transform .18s; display: inline-block; }
    .arr.open { transform: rotate(90deg); }
    .acc-body { padding: 6px 14px 10px; display: none; }

    /* WBS Task */
    .wt { display: flex; align-items: flex-start; gap: 9px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
    .wt:last-child { border-bottom: none; padding-bottom: 0; }
    .wt-body { flex: 1; min-width: 0; }
    .wt-name { font-size: .83rem; line-height: 1.4; }
    .wt-id { font-size: .7rem; color: var(--sub); margin-right: 4px; }
    .wt-detail { font-size: .74rem; color: var(--sub); margin-top: 2px; line-height: 1.5; }

    /* Projects */
    .proj { padding: 11px 0; border-bottom: 1px solid var(--border); }
    .proj:last-child { border-bottom: none; }
    .proj-hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 3px; flex-wrap: wrap; }
    .proj-name { font-weight: 700; font-size: .93rem; }
    .proj-right { display: flex; align-items: center; gap: 7px; }
    .desc { color: var(--sub); font-size: .82rem; line-height: 1.55; }
    .sub-items { margin-top: 6px; padding-left: 12px; border-left: 2px solid rgba(255,255,255,.08); }
    .sub-item { font-size: .76rem; color: rgba(160,160,176,.7); padding: 2px 0; }
    .sub-item::before { content: "↳ "; color: var(--accent2); }

/* ── 月5万 ロードマップ ── */
    .inc-hd-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    .inc-goal { font-size:1.4rem; font-weight:700;
      background:linear-gradient(90deg,#4cd964,#00f2fe);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .inc-deadline { font-size:.72rem; color:var(--sub); border:1px solid var(--border);
      padding:3px 10px; border-radius:20px; }
    .inc-head { font-size:.86rem; line-height:1.7; color:#e8e8f0; margin-bottom:14px; }
    .inc-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
    .inc-item { border:1px solid var(--border); border-radius:11px; padding:13px 15px;
      background:rgba(255,255,255,.03); border-left-width:3px; }
    .inc-item.ok   { border-left-color:var(--primary); background:rgba(76,217,100,.06); }
    .inc-item.warn { border-left-color:var(--warning); }
    .inc-item.ng   { border-left-color:rgba(255,255,255,.15); opacity:.72; }
    .inc-name { font-weight:700; font-size:.86rem; margin-bottom:7px; }
    .inc-need { font-size:.78rem; color:var(--accent); line-height:1.5; margin-bottom:6px; }
    .inc-reach { display:inline-block; font-size:.7rem; font-weight:700; padding:2px 9px;
      border-radius:20px; margin-bottom:8px; }
    .inc-item.ok   .inc-reach { background:rgba(76,217,100,.18); color:var(--primary); }
    .inc-item.warn .inc-reach { background:rgba(255,204,0,.18);  color:var(--warning); }
    .inc-item.ng   .inc-reach { background:rgba(255,45,85,.15);  color:var(--danger); }
    .inc-body { font-size:.76rem; color:var(--sub); line-height:1.65; }
    .inc-plan { margin-top:14px; padding:13px 15px; border-radius:11px;
      background:rgba(76,217,100,.08); border:1px solid rgba(76,217,100,.28);
      font-size:.82rem; line-height:1.75; }
    .inc-risk { margin-top:10px; padding:12px 15px; border-radius:11px;
      background:rgba(255,45,85,.07); border:1px solid rgba(255,45,85,.28);
      font-size:.79rem; line-height:1.7; color:#ffd8de; }

    /* ── Calendar ── */
    .cal-wrap { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
    .cal-left { flex-shrink: 0; }
    .cal-month-label { font-size: .8rem; font-weight: 700; color: var(--text); text-align: center; margin-bottom: 8px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 34px); gap: 2px; }
    .cal-dh { width: 34px; height: 22px; display: flex; align-items: center; justify-content: center;
      font-size: .62rem; color: var(--sub); font-weight: 600; }
    .cal-dh.sun { color: #ff6b7a; } .cal-dh.sat { color: var(--accent2); }
    .cal-cell { width: 34px; height: 34px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; border-radius: 7px; font-size: .78rem; color: var(--sub); position: relative; }
    .cal-cell.today { background: rgba(79,172,254,.2); color: var(--accent); font-weight: 700; }
    .cal-cell.has-ev { color: var(--text); }
    .cal-cell.sunday { color: rgba(255,107,122,.6); }
    .cal-cell.saturday { color: rgba(79,172,254,.6); }
    .cal-cell.today.sunday, .cal-cell.today.saturday { color: var(--accent); }
    .cal-dots { display: flex; gap: 2px; margin-top: 2px; }
    .cal-dot { width: 4px; height: 4px; border-radius: 50%; }
    .dot-oshipay { background: var(--accent); }
    .dot-autocraft { background: var(--warning); }
    .dot-blog { background: var(--primary); }
    .dot-android { background: var(--primary); }
    .dot-sns { background: var(--danger); }
    .dot-other { background: var(--sub); }

    .cal-right { flex: 1; min-width: 220px; }
    .cal-ms-title { font-size: .75rem; color: var(--accent); font-weight: 700; letter-spacing: .5px;
      text-transform: uppercase; margin-bottom: 8px; }
    .cal-ms { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,.05); }
    .cal-ms:last-child { border-bottom: none; }
    .cal-ms-date { font-size: .7rem; color: var(--accent2); white-space: nowrap; width: 52px; flex-shrink: 0; padding-top: 1px; }
    .cal-ms-date.overdue { color: var(--danger); }
    .cal-ms-body { flex: 1; }
    .cal-ms-label { font-size: .8rem; color: var(--sub); line-height: 1.4; }
    .cal-ms-proj { font-size: .65rem; margin-top: 2px; }
    .cal-ms-proj.oshipay  { color: var(--accent); }
    .cal-ms-proj.oshipay2 { color: var(--accent); }
    .cal-ms-proj.autocraft{ color: var(--warning); }
    .cal-ms-proj.blog     { color: var(--primary); }
    .cal-ms-proj.android  { color: var(--primary); }
    .cal-ms-proj.sns      { color: var(--danger); }
    .cal-nav { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 10px; }
    .cal-nav-btn { background: rgba(255,255,255,.08); border: 1px solid var(--border); color: var(--sub);
      border-radius: 6px; padding: 3px 10px; font-size: .75rem; cursor: pointer; }
    .cal-nav-btn:hover { background: rgba(255,255,255,.14); color: var(--text); }
    .cal-nav-label { font-size: .72rem; color: var(--sub); min-width: 70px; text-align: center; }

    /* Notion 棲み分け */
    .split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 4px; }
    .split-item { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .split-item.html-side { border-color: rgba(79,172,254,.35); background: rgba(79,172,254,.05); }
    .split-item.notion-side { border-color: rgba(255,204,0,.25); background: rgba(255,204,0,.04); }
    .split-head { font-size: .85rem; font-weight: 700; margin-bottom: 8px; }
    .split-rule { font-size: .7rem; font-weight: 600; margin: 6px 0 4px; color: var(--sub); letter-spacing: .3px; }
    .split-item ul { list-style: none; padding: 0; margin: 0; }
    .split-item li { font-size: .78rem; color: var(--sub); padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.04); }
    .split-item li:last-child { border-bottom: none; }
    .split-item.html-side li::before { content: "• "; color: var(--accent2); }
    .split-item.notion-side li::before { content: "• "; color: var(--warning); }
    .split-rule-box { background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 14px; font-size: .78rem; color: var(--sub); text-align: center; margin-top: 4px; }
    .split-rule-box strong { color: var(--text); }

    /* Focus list */
    ul.fl { list-style: none; padding: 0; margin: 0; }
    ul.fl li { display: flex; gap: 8px; align-items: flex-start; padding: 7px 0;
      border-bottom: 1px solid var(--border); font-size: .86rem; color: var(--sub); }
    ul.fl li:last-child { border-bottom: none; }
    ul.fl li::before { content: "▶"; color: var(--accent); font-size: .68rem; margin-top: 4px; flex-shrink: 0; }

    /* KPI */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
    .kpi-item { background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; }
    .kpi-lbl { font-size: .73rem; color: var(--sub); margin-bottom: 4px; }
    .kpi-val { font-size: 1rem; font-weight: 700; color: var(--accent); }
    .kpi-tgt { font-size: .68rem; color: rgba(160,160,176,.55); margin-top: 3px; }

    /* Sub WBS */
    .sub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .sub-card { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .sub-card h4 { margin: 0 0 10px; font-size: .9rem; }
    .st { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: .8rem; color: var(--sub); }
    .st:last-child { border-bottom: none; }
    .st-name { flex: 1; line-height: 1.45; }

    /* Strategy */
    .strat-phase { display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .8px;
      background: rgba(79,172,254,.16); color: var(--accent); border: 1px solid rgba(79,172,254,.35);
      border-radius: 20px; padding: 4px 12px; }
    .strat-head { font-size: 1rem; font-weight: 700; line-height: 1.6; margin: 10px 0 16px; }
    .strat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
    .strat-item { background: rgba(255,255,255,.04); border: 1px solid var(--border);
      border-radius: 10px; padding: 13px 15px; }
    .strat-item-hd { display: flex; align-items: center; gap: 8px; font-size: .86rem; font-weight: 700; margin-bottom: 6px; }
    .strat-item-body { font-size: .78rem; color: var(--sub); line-height: 1.65; }
    .strat-item-body b, .oq-stance b { color: var(--text); }
    .oq { padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
    .oq:last-child { border-bottom: none; }
    .oq-q { font-size: .84rem; font-weight: 600; display: flex; gap: 7px; align-items: flex-start; }
    .oq-q::before { content: "?"; color: var(--warning); font-weight: 700; flex-shrink: 0; }
    .oq-stance { font-size: .78rem; color: var(--sub); line-height: 1.65; margin-top: 4px; padding-left: 16px;
      border-left: 2px solid rgba(79,172,254,.3); }

    /* Heroes requirements */
    .hr-warn { background: rgba(255,204,0,.08); border: 1px solid rgba(255,204,0,.32); border-radius: 10px;
      padding: 12px 15px; font-size: .81rem; color: var(--sub); line-height: 1.7; margin-bottom: 14px; }
    .hr-warn b, .hr-verdict b, .hr-risk b { color: var(--text); }
    .hr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
    .hr-item { border: 1px solid rgba(255,45,85,.28); background: rgba(255,45,85,.05);
      border-radius: 10px; padding: 13px 15px; }
    .hr-hd { display: flex; align-items: center; gap: 8px; font-size: .87rem; font-weight: 700; }
    .hr-rule { font-size: .78rem; color: var(--accent); font-weight: 600; margin-top: 6px; }
    .hr-total { font-size: .8rem; color: var(--sub); margin-top: 4px; }
    .hr-risk { font-size: .73rem; color: rgba(160,160,176,.75); line-height: 1.6; margin-top: 7px;
      padding-top: 7px; border-top: 1px solid rgba(255,255,255,.07); }
    .hr-verdict { margin-top: 14px; background: rgba(76,217,100,.07); border: 1px solid rgba(76,217,100,.32);
      border-radius: 10px; padding: 13px 16px; font-size: .82rem; color: var(--sub); line-height: 1.75; }

    .hr-cap { background: rgba(76,217,100,.07); border: 1px solid rgba(76,217,100,.3); border-radius: 10px;
      padding: 12px 15px; font-size: .81rem; color: var(--sub); line-height: 1.75; margin-bottom: 14px; }
    .hr-cap b { color: var(--text); }

    /* SNS baseline */
    .sns-baseline { display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .5px;
      background: rgba(255,204,0,.14); color: var(--warning); border: 1px solid rgba(255,204,0,.35);
      border-radius: 20px; padding: 4px 12px; margin-bottom: 10px; }
    .sns-note { font-size: .8rem; color: var(--sub); line-height: 1.7; margin-bottom: 14px; }
    .sns-note b, .sns-memo b, .sns-verdict b { color: var(--text); }
    .sns-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .sns-acc { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
      background: rgba(255,255,255,.03); }
    .sns-acc-hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sns-acc-name { font-size: .88rem; font-weight: 700; }
    .sns-acc-url { font-size: .68rem; color: rgba(160,160,176,.5); margin-top: 2px; word-break: break-all; }
    .sns-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      gap: 8px; margin: 10px 0 8px; }
    .sns-metric { min-width: 0; background: rgba(255,255,255,.04);
      border-radius: 7px; padding: 7px 6px; text-align: center; }
    .sns-metric-k { font-size: .64rem; color: var(--sub); }
    .sns-metric-v { font-size: .95rem; font-weight: 700; color: var(--accent); margin-top: 2px; }
    .sns-memo { font-size: .75rem; color: var(--sub); line-height: 1.6; }
    .sns-verdict { margin-top: 14px; background: rgba(255,45,85,.08); border: 1px solid rgba(255,45,85,.3);
      border-radius: 10px; padding: 12px 15px; font-size: .81rem; color: var(--sub); line-height: 1.7; }

    /* Portfolio */
    .pf-note { font-size: .82rem; color: var(--sub); line-height: 1.65; margin-bottom: 14px; }
    .pf-note b { color: var(--text); }
    .pf-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .pf-stat { background: rgba(79,172,254,.06); border: 1px solid rgba(79,172,254,.22);
      border-radius: 10px; padding: 12px 14px; text-align: center; }
    .pf-stat-lbl { font-size: .72rem; color: var(--sub); }
    .pf-stat-val { font-size: 1.5rem; font-weight: 700; color: var(--accent); line-height: 1.3; margin: 2px 0; }
    .pf-stat-sub { font-size: .66rem; color: rgba(160,160,176,.6); line-height: 1.4; }
    .pf-links { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
    .pf-link { display: block; text-decoration: none; background: rgba(255,255,255,.04);
      border: 1px solid var(--border); border-radius: 10px; padding: 12px 15px; }
    .pf-link:hover { background: rgba(255,255,255,.08); border-color: rgba(79,172,254,.4); }
    .pf-link-lbl { font-size: .87rem; font-weight: 700; color: var(--accent); }
    .pf-link-desc { font-size: .74rem; color: var(--sub); margin-top: 3px; }
    .pf-link-url { font-size: .68rem; color: rgba(160,160,176,.5); margin-top: 4px; word-break: break-all; }

    /* Blocker banner */
    .blocker-banner { background: rgba(255,45,85,.12); border: 1px solid rgba(255,45,85,.5);
      border-radius: 14px; padding: 16px 20px; display: flex; align-items: flex-start; gap: 14px; }
    .blocker-icon { font-size: 1.6rem; flex-shrink: 0; line-height: 1; }
    .blocker-body { flex: 1; }
    .blocker-title { font-size: .95rem; font-weight: 700; color: var(--danger); margin-bottom: 4px; }
    .blocker-note { font-size: .8rem; color: rgba(255,100,120,.8); line-height: 1.6; }
    .blocker-deadline { font-size: .72rem; color: var(--danger); margin-top: 6px; font-weight: 600; }
    .blocker-days { font-size: 1.4rem; font-weight: 700; color: var(--danger); line-height: 1;
      background: rgba(255,45,85,.15); border-radius: 8px; padding: 6px 12px; text-align: center; flex-shrink: 0; }

        tasks:[

          { id:"H-3", name:"クエスト系6本 — アイコン・課金・申請物（コードは完成済み）", detail:"<b>2026-09-10：6本ぶんのコードが完成し、全てXcodeでビルド＆シミュレータ動作確認済み</b>。<code>82.iosapp/24.KinenQuest</code>(禁煙) / <code>25.HayaokiQuest</code>(早起き) / <code>26.ChokinQuest</code>(貯金) / <code>27.DokushoQuest</code>(読書) / <code>28.KakeiQuest</code>(家計) / <code>29.SuiminQuest</code>(睡眠)。構想リストの #17/#18/#19/#20/#27/#30 に対応。<br><b>共通土台 <code>82.iosapp/QuestKit</code> を作ったのがこの回の本体</b>。画面・SwiftData保存・経験値・レベル・カレンダー・グラフ・通知を1箇所に集約し、各アプリが書くのは <code>QuestConfig</code> 1つ（実質20行）だけ。<b>7本目以降のクエスト系は設定ファイル＋project.yml のコピーで増やせる</b>。<br><b>✅ アプリアイコン6本は 2026-09-10 に完成</b>（1024px・単色背景＋白い図形の2色・既存の断酒／勉強／運動クエストに準拠。ホーム画面の実寸で判別できることを確認済み。生成スクリプトは会話の scratchpad にあり、<b>Apple のライセンス上 SF Symbols はアイコンに使えないため図形はすべてオリジナル</b>）。<br><b>✅ 課金導線も 2026-09-10 に完了</b>。QuestKit に <code>QuestStore</code>（StoreKit 2）とペイウォールを追加し、<b>6本すべてに適用済み</b>。商品IDはバンドルIDから機械的に生成（例 <code>com.asagiri.kinenquest.sub.monthly</code>）。価格は既存に合わせて<b>月額¥300／年額¥1,980／買い切り¥3,800</b>。各アプリに <code>.storekit</code> を同梱しスキームに設定済み。<br><b>無料とプレミアムの線引き：記録・レベル・直近30日グラフは無料のまま。プレミアムは iCloud同期／記録の書き出し・読み込み／31日より前の閲覧／通算の分析／節約金額の条件変更。</b><b>ペイウォールの文言は「本気の禁煙宣言。」</b>のように、機能の羅列ではなく決意を後押しする形にした（6本それぞれ別の文言）。iCloud同期は SwiftData + CloudKit。<b>QuestRecord の全プロパティに既定値が必要</b>（CloudKitの制約）で、同期の切り替えは<b>再起動で反映</b>する作り（SwiftDataは起動後にストア構成を変えられないため）。同期で開けなかったときはローカルへ退避して設定画面に理由を出す。節約金額は「達成日×1日分」ではなく<b>「その日に我慢できた本数（普段の本数−吸った本数）×1本の金額」</b>に変更。既定は1日20本・1箱600円で、0本なら600円。1本でも減らせば積み上がる。<b>普段の本数を超えた日は赤字として ▲¥240 のように出す</b>（0で止めない＝吸いすぎた日をなかったことにしない）。記録シートと通算の両方に効く。<br><b>⚠️ アーカイブ前に iCloud コンテナ <code>iCloud.&lt;バンドルID&gt;</code> の作成が必要</b>（未作成だと署名が通らない。シミュレータでは落ちない）。<b>⚠️ .storekit に <code>_locale: ja_JP</code> と <code>_storefront: JPN</code> が無いとペイウォールがドル表示になる</b>（実際になった。6本とも修正済み）。記録そのものは絶対に塞がない（塞ぐと無価値になるため）。無料でも記録は消えず閲覧が制限されるだけ。<br><b>⚠️ ハマった点：QuestKit にファイルを足したら、各アプリで <code>xcodegen generate</code> をやり直さないとビルドが落ちる</b>（XcodeGen は生成時にファイルを列挙するため）。共通土台に手を入れたら6本とも再生成＋再ビルドすること。<br><b>✅ 禁煙クエスト（24）は申請物が全部揃った</b>：<b>宣伝文字入りスクショ12枚</b>（3サイズ×4画面）／サイト4ページ公開済み／申請内容.md。スクショは <code>AppStore/make_screenshots.py</code> で生成（16.NonStop の同名スクリプトと同じ体裁：グラデ背景＋角丸カード＋キャッチコピー）。<b>生キャプチャは raw_* に、提出用は iphone69/iphone65/ipad13 に分けてある。</b>01〜03はプレミアム有効・04は無料状態で撮影（4枚目のコピーが「記録は、ずっと無料。」のため）。起動引数 <code>-screenshotMode YES</code> で開発用UIを伏せられる。<br><b>⚠️ iPad のレイアウトは縦に伸びず下半分が空く。</b>スクショは自動トリムで見栄えを整えたが、<b>アプリ側の iPad レイアウトを詰めるのは別途やる価値あり</b>（6本共通なので QuestKit を直せば全部に効く）。<b>残り：App Store Connect での入力、App内課金3つの登録、課金の審査用スクショ（Xcodeから実行して撮る）、年齢制限の質問票をシリーズで統一。</b><br><b>他5本の残り：スクリーンショット／申請物。</b><br><b>✅ 2026-09-12：貯金クエスト（26.ChokinQuest）の申請物が揃った。</b>MARKETING_VERSION を <code>1.0.0</code> に更新／<b>宣伝文字入りスクショ12枚</b>（3サイズ×4画面。3台のシミュレータで native 撮影し、<code>AppStore/make_screenshots.py</code> で合成）／公開サイト <code>/chokinquest/</code> 4ページ＋icon.png を push 済み（<b>5URLとも200を確認</b>）／<code>AppStore/申請内容.md</code>。文面は「お金が貯まらない」悩みに寄せ、<b>禁煙系の節約金額・医療の注意書きは持ち込んでいない</b>。代わりに<b>「金融サービスではない・銀行口座と接続しない・投資助言をしない」</b>を明記した。<br><b>⚠️ 貯金クエストはアーカイブ未完了。iCloud コンテナ <code>iCloud.com.asagiri.chokinquest</code> が Apple 側に無いため。</b>Xcode の Signing &amp; Capabilities でしか作れない（人間の作業）。それ以外は署名不要の Release ビルドで確認済み（BUILD SUCCEEDED／バージョン1.0.0／DEBUG専用の起動引数は QuestKit 側ですべて <code>#if DEBUG</code> に入っている）。<br><b>⚠️ 手順書の <code>strings | grep -x</code> による DEBUG引数チェックは当てにならない</b>：Swift は15バイト以下の文字列リテラルを即値で埋め込むため<b>Debugビルドでも0件</b>になる（2026-09-12 に両ビルドで実測）。判定はソースの <code>#if DEBUG</code> を見ること。<br><b>貯金クエストで人間に残っている作業：</b>App Store Connect でアプリ新規作成（<b>名前は日本語で「貯金クエスト」</b>）／App内課金3つの登録／iCloud コンテナ作成／Archive と Organizer からの Distribute。<br><b>✅ 2026-09-12：家計クエスト（28.KakeiQuest）の申請物が揃った。</b>MARKETING_VERSION を <code>1.0.0</code> に更新／<b>宣伝文字入りスクショ12枚</b>（3サイズ×4画面。42日ぶんのSwiftDataを直接生成して流し込み、3台のシミュレータで native 撮影→<code>AppStore/make_screenshots.py</code> で合成）／公開サイト <code>/kakeiquest/</code> 4ページ＋icon.png を push 済み（<b>5URLとも200を確認</b>）／<code>AppStore/申請内容.md</code>（文字数は検算済み）。<br><b>⚠️ 家計クエストだけ「少ないほど良い」指標（<code>.budget</code>）。</b>1日の予算（既定2,000円）以内なら達成で、<b>予算を余らせるほど経験値が増える（30〜60XP、超過日は10XP）</b>。他5本と逆なので文面を作り分けた。そのため<b>記録タブのグラフは棒の高さ＝獲得した経験値</b>（使った額を高さにすると締めた日ほど棒が短くなり逆効果のため）。サイト・説明文・審査メモにもこの前提で書いてある。<br>文面は「気づくと使っている／何に消えたか分からない」悩みに寄せ、<b>家計簿アプリとの違い＝入力が1日1回・合計金額ひとつだけ</b>を前面に出した。費目別集計や家計診断は<b>できないと明記</b>（過大表示を避けるため）。禁煙系の節約金額・医療の注意書きは持ち込んでいない。<br><b>⚠️ 家計クエストはアーカイブ未完了。iCloud コンテナ <code>iCloud.com.asagiri.kakeiquest</code> が Apple 側に無いため</b>（<code>ARCHIVE FAILED</code>／Provisioning profile doesn't include the iCloud capability）。Xcode の Signing &amp; Capabilities でしか作れない（人間の作業）。それ以外は署名不要の Release ビルドで確認済み（<b>BUILD SUCCEEDED</b>／CFBundleShortVersionString <code>1.0.0</code>／CFBundleVersion <code>1</code>／表示名「家計クエスト」／iPad4方向の宣言あり／DEBUG専用の起動引数は QuestKit 側ですべて <code>#if DEBUG</code>）。<br><b>家計クエストで人間に残っている作業：</b>App Store Connect でアプリ新規作成（<b>名前は日本語で「家計クエスト」</b>／バンドルID <code>com.asagiri.kakeiquest</code>／SKU <code>kakeiquest</code>）／App内課金3つの登録／iCloud コンテナ作成／Archive と Organizer からの Distribute。<br><b>✅ 2026-09-12：読書クエスト（27.DokushoQuest）の申請物が揃った。</b>MARKETING_VERSION を <code>1.0.0</code> に更新／<b>宣伝文字入りスクショ12枚</b>（3サイズ×4画面。38日ぶんのSwiftDataを直接生成して流し込み、3台のシミュレータで native 撮影→<code>AppStore/make_screenshots.py</code> で合成。Lv8・連続8日・達成率84%の使い込んだ画面にした）／公開サイト <code>/dokushoquest/</code> 4ページ＋icon.png を push 済み（<b>5URLとも200を確認</b>）／<code>AppStore/申請内容.md</code>（文字数は検算済み）。<br>文面は「積ん読が減らない／読む時間が取れない」悩みに寄せ、<b>±10 のまとめ加算ボタン</b>（20ページを1タップずつ押さずに済む）を説明文・サポート・審査メモの3箇所に書いた。<b>書名の登録は不要</b>＝その日のページ数だけで続けられることを前面に出し、書名を残したい人にはメモ欄を案内している。<b>電子書籍ストア・図書館システム・書誌DBとは接続しない</b>、<b>本文を配信する電子書籍リーダーではない</b>と明記（審査で誤解されないため）。禁煙系の節約金額・医療の注意書き、貯金系の銀行口座・投資助言の記述は持ち込んでいない。<br><b>⚠️ 読書クエストもアーカイブ未完了。iCloud コンテナ <code>iCloud.com.asagiri.dokushoquest</code> が Apple 側に無いため</b>（<code>ARCHIVE FAILED</code>／Provisioning profile doesn't include the iCloud capability ほか4件）。Xcode の Signing &amp; Capabilities でしか作れない（人間の作業）。それ以外は署名不要の Release ビルドで確認済み（<b>BUILD SUCCEEDED</b>／CFBundleShortVersionString <code>1.0.0</code>／CFBundleVersion <code>1</code>／表示名「読書クエスト」／<code>ITSAppUsesNonExemptEncryption</code> false／iPad4方向の宣言あり／DEBUG専用の起動引数4つは QuestKit 側ですべて <code>#if DEBUG</code>）。<br><b>⚠️ スクショ撮影のハマり：同じシミュレータに他のクエストアプリが前面に残っていると、それが写り込む。</b>iPad の 04_settings が家計クエストの画面（赤いテーマ・¥表示）になっており撮り直した。撮影前に他アプリを <code>simctl terminate</code> すること。<br><b>読書クエストで人間に残っている作業：</b>App Store Connect でアプリ新規作成（<b>名前は日本語で「読書クエスト」</b>／バンドルID <code>com.asagiri.dokushoquest</code>／SKU <code>dokushoquest</code>）／App内課金3つの登録／iCloud コンテナ作成／Archive と Organizer からの Distribute。<br><b>クエスト系の進捗：申請物が揃ったのは 24(禁煙)・25(早起き)・26(貯金)・27(読書)・28(家計) の5本。残り 29(睡眠) の1本。</b><br><b>注意：似たアプリ6本を短期間に連続申請するとリジェクトされる可能性がある。</b>出す順番と間隔を決めてから申請すること。まず1本出して審査の反応を見るのが安全。", pr:"mid", st:"todo" },
          { id:"H-4", name:"水分補給リマインダー（#28）— コード完成・アイコン済", detail:"<b>2026-09-10 完成</b>。<code>82.iosapp/30.WaterReminder</code>。ビルド＋シミュレータで記録・取り消し・通知許可・スケジュール登録まで動作確認済み。アプリアイコンも作成済み。<br>通知は「9時〜21時を2時間おき」を<b>時刻ごとに別々の通知として登録し、設定変更のたびに貼り替える</b>方式（1本の繰り返し通知では表現できないため）。既定は1日7回。<br><b>QuestKit はあえて使っていない</b>：クエスト系は「1日1件→経験値→レベル」だが、こちらは1日に何度も記録しレベルの概念がないため骨格が合わない。<b>#29 ストレッチタイマーを作る時に「タイマー＋通知」の共通土台が要るか見直す。</b><br><b>残り：スクリーンショット／課金／申請物。</b>", pr:"mid", st:"todo" },
          { id:"H-5", name:"ストレッチタイマー（#29）— コード完成・アイコン済", detail:"<b>2026-09-10 完成</b>。<code>82.iosapp/31.StretchTimer</code>。HOLD（PlunkTimer）の兄弟アプリ。ビルド＋シミュレータで再生・スキップ・完了・記録保存まで動作確認済み。アイコン済み。<br><b>部位別プリセット6種</b>（首肩／背中腰／脚股関節／デスクワークの合間／寝る前／全身リセット）。プリセットは <code>StretchRoutine.presets</code> に1つ足すだけで増える（画面側の変更不要）。<br>作りの要点：<b>自動ロックを止める</b>（手が塞がるため）／<b>姿勢の切替を音と振動で通知</b>（画面を見ていなくても分かる）／<b>スキップ分は記録秒数に入れない</b>（実際に動いた時間だけ残す）。<br><b>水分補給との共通土台は作らないと判断</b>：水分補給は「通知でアプリ外から呼ぶ」、ストレッチは「開いている間だけ動く前景タイマー」で、重なるのは秒を数えることだけ。土台化の費用に見合わない。<br><b>残り：スクリーンショット／課金／申請物。</b>", pr:"mid", st:"todo" },
          { id:"H-6", name:"ユーティリティ3本（#23圧縮・#24PDF・#33名刺OCR）— コード完成・アイコン済", detail:"<b>2026-09-10 完成</b>。<code>82.iosapp/32.SimpleZip</code> / <code>33.SimplePDF</code> / <code>34.CardOCR</code>。3本ともビルド＋アイコン済み。<b>外部ライブラリはゼロ</b>（ZIPは NSFileCoordinator、PDFは PDFKit、OCRは Vision）。<br><b>検証状況：</b>名刺OCRはシミュレータで実画像を読ませ、氏名・会社名・電話・メール・サイトの取得を確認。ZIP／PDFは<b>アプリの実ソースをmacOS向けにコンパイルして実行</b>し、圧縮（3ファイル・同名リネーム）と結合（3+2=5ページ）・範囲抽出（2〜4の3ページ）を確認。<b>ただしファイルApp からの実選択は未通し</b>（手操作が要るため）。実機で1度ずつ触ること。<br><b>ハマりどころ（次に同種を作る時に効く）：</b>① ファイルApp 由来のURLは <code>startAccessingSecurityScopedResource()</code> を通さないと必ず読めない　② <code>PhotosPicker</code> は <code>Menu</code> の中に置くと開かない（<code>.photosPicker(isPresented:)</code> を使う）　③ カメラは <code>NSCameraUsageDescription</code> が無いと起動時に落ちる　④ 氏名判定で「長」「部」の1文字を使うと<b>長谷川</b>のような姓を弾く。役職は語で持つ。<br><b>残り：実機での通し確認／スクリーンショット／課金／申請物。</b>", pr:"mid", st:"todo" },
          { id:"H-7", name:"クエスト系 プレミアムの中身を厚くする（未着手・方針決定済み）", detail:"<b>2026-09-11 に方針だけ決めた。実装はまだ入れていない。</b>現在のプレミアムは iCloud同期／書き出し・読み込み／31日より前の閲覧／通算の分析の4つで、月¥300・買い切り¥3,800 に対してやや薄い。<b>QuestKit に入れれば6本すべてに効く。</b><br><b>① ストリーク保護（お守り）</b> — 1日記録を忘れても連続日数を途切れさせない権利を月に数回付与。継続系アプリで最も課金理由になりやすい（「ここで途切れたくない」が買う瞬間になる）。実装は <code>QuestProgress.currentStreak</code> がお守り消費日を成功扱いする形＋消費履歴の保存＋ホームに「お守り 残りN」表示。<br><b>② 詳細な分析（曜日別・月別）</b> — どの曜日に崩れやすいか、月ごとの推移。<b>既存の記録だけで作れるので実装量は少ない。</b>今の「通算の分析」を厚くする形で QuestStatsView に追加。<br><b>着手タイミングは未定。</b>残り5本の申請を先に片付けるか、先にプレミアムを厚くしてから申請するかは要判断。<b>先に入れる場合は、申請前の5本すべてに同時に載る利点がある</b>（申請後に追加すると審査がもう一周する）。<br>見送った案：ホーム画面ウィジェット（WidgetKit拡張が必要で実装量が多い）、アイコン・テーマ変更（継続の動機に直結しない）。", pr:"mid", st:"todo" },
          { id:"H-8", name:"申請前チェッカー（tools/preflight.py）— 同じ所で2回詰まったので作った", detail:"<b>2026-09-12 作成。</b><code>python3 82.iosapp/tools/preflight.py 25.HayaokiQuest</code> のように使う。<br><b>機械的に確認する：</b>バージョンが1.0以上／entitlementsのiCloudコンテナ名がバンドルIDと一致／StoreKitが <code>_locale:ja_JP _storefront:JPN</code>（無いとドル表示）／App内課金3つのIDが正しい／スクショ12枚の寸法とアルファ／公開サイト4ページがHTTP 200／アーカイブにDEBUG専用フラグが混入していないか。<br><b>Apple側にしか無い2つ</b>（App Store Connect のアプリ登録・iCloudコンテナ）は「要確認」として赤で出し、人間がやることを明示する。<b>この2つで実際に2回止まった</b>（archive失敗＝iCloudコンテナ未作成／Distribute失敗＝アプリ未登録 DistributionAppRecordProviderError error 0）。<br><b>将来：App Store Connect APIキー（.p8）を <code>~/.appstoreconnect/</code> に置けば、この2つも自動確認できるようにコードは書いてある</b>（ES256のJWTを作って /v1/apps を叩く実装済み・キー待ち）。キーがあればCLIからのアップロードも可能になり、Xcode Organizer に頼らなくてよくなる。<b>キー発行は未実施。</b>", pr:"mid", st:"todo" },

const SL = { run:"RUN", plan:"PLAN", pend:"HOLD" }
const PROJ_COLOR = { oshipay2:"oshipay", autocraft:"autocraft", blog:"blog",
                     android:"android", sns:"sns", other:"other" }
const PROJ_LABEL = { oshipay2:"OshiPay", autocraft:"AutoCraft", blog:"副業ブログ",
                     android:"Android展開", sns:"SNS戦略", other:"その他" }

function dotH(st) {
  const c = { todo:"dt", doing:"dd", done:"dn", future:"df" }[st] || "dt"
  return `<div class="dot ${c}"></div>`
}
function prH(p) {
  return p==="high" ? `<span class="ph">🔴 高</span>`
       : p==="mid"  ? `<span class="pm">🟡 中</span>`
       : p==="low"  ? `<span class="pl">🟢 低</span>`
       :               `<span class="pf">⚪ 将来</span>`
}
function fmtDate(str) {
  const d = new Date(str)
  return `${d.getMonth()+1}/${d.getDate()}`
}
function isOverdue(str) {
  return new Date(str) < new Date(new Date().toDateString())
}

// ═══════════════════════════════════════════
//  CALENDAR
// ═══════════════════════════════════════════
let calYear, calMonth
function initCal() {
  const now = new Date()
  calYear  = now.getFullYear()
  calMonth = now.getMonth()
}
function renderCalendar() {
  const now      = new Date()
  const today    = now.getDate()
  const isCurMo  = now.getFullYear()===calYear && now.getMonth()===calMonth
  const firstDay = new Date(calYear, calMonth, 1).getDay()       // 0=Sun
  const days     = new Date(calYear, calMonth+1, 0).getDate()
  const monthNames = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"]

  // Build event map for current calendar month
  const evMap = {}
  D.milestones.forEach(m => {
    const d = new Date(m.date)
    if (d.getFullYear()===calYear && d.getMonth()===calMonth) {
      const k = d.getDate()
      if (!evMap[k]) evMap[k] = []
      evMap[k].push(m)
    }
  })

  // Grid
  let g = `<div class="cal-month-label">${calYear}年 ${monthNames[calMonth]}</div>
    <div class="cal-grid">`
  ;["日","月","火","水","木","金","土"].forEach((d,i) =>
    g += `<div class="cal-dh${i===0?' sun':i===6?' sat':''}">${d}</div>`)
  for (let i=0;i<firstDay;i++) g += `<div class="cal-cell"></div>`
  for (let d=1;d<=days;d++) {
    const dow   = (firstDay + d - 1) % 7
    const cls   = [
      isCurMo && d===today ? "today" : "",
      dow===0 ? "sunday" : dow===6 ? "saturday" : "",
      evMap[d] ? "has-ev" : ""
    ].filter(Boolean).join(" ")
    let dots = ""
    if (evMap[d]) {
      dots = `<div class="cal-dots">`
      evMap[d].forEach(e => dots += `<div class="cal-dot dot-${PROJ_COLOR[e.proj]||'other'}"></div>`)
      dots += `</div>`
    }
    g += `<div class="cal-cell ${cls}">${d}${dots}</div>`
  }
  g += `</div>`
  g += `<div class="cal-nav">
    <button class="cal-nav-btn" onclick="moveCal(-1)">◀</button>
    <span class="cal-nav-label">月移動</span>
    <button class="cal-nav-btn" onclick="moveCal(1)">▶</button>
  </div>`

  // Upcoming milestones (today → +100 days)
  const lo = new Date(); lo.setHours(0,0,0,0)
  const hi = new Date(lo); hi.setDate(hi.getDate()+100)
  const upcoming = D.milestones
    .filter(m => { const d=new Date(m.date); return d>=lo && d<=hi })
    .sort((a,b)=>new Date(a.date)-new Date(b.date))

  let ms = `<div class="cal-ms-title">📌 直近マイルストーン</div>`
  if (!upcoming.length) {
    ms += `<div style="font-size:.78rem;color:var(--sub)">マイルストーンなし</div>`
  } else {
    upcoming.forEach(m => {
      const od = isOverdue(m.date)
      ms += `<div class="cal-ms">
        <div class="cal-ms-date${od?' overdue':''}">${fmtDate(m.date)}${od?' ⚠':''}
        </div>
        <div class="cal-ms-body">
          <div class="cal-ms-label">${m.label}</div>
          <div class="cal-ms-proj ${m.proj||'other'}">${PROJ_LABEL[m.proj]||'その他'}</div>
        </div>
        ${prH(m.pr)}
      </div>`
    })
  }

  document.getElementById("cal-grid-wrap").innerHTML = g
  document.getElementById("cal-ms-wrap").innerHTML   = ms
}
function moveCal(dir) {
  calMonth += dir
  if (calMonth < 0)  { calMonth=11; calYear-- }
  if (calMonth > 11) { calMonth=0;  calYear++ }
  renderCalendar()
}

    <div class="strat-grid">`
  s.pillars.forEach(p => h += `<div class="strat-item">
    <div class="strat-item-hd"><span>${p.icon}</span>${p.title}</div>
    <div class="strat-item-body">${p.body}</div>
  </div>`)
  h += `</div>
    <h3>🤔 未決の論点 — 今の暫定スタンス</h3>`
  s.openQuestions.forEach(o => h += `<div class="oq">
    <div class="oq-q">${o.q}</div>
    <div class="oq-stance">${o.stance}</div>
  </div>`)
  h += `</div>`
}

/* ── Notion 棲み分け ── */
h += `<div class="card">
  <h2>🗺️ 管理ツールの棲み分け</h2>
  <div class="split-grid">
    <div class="split-item html-side">
      <div class="split-head">🗂️ このダッシュボード（ops-dashboard）</div>
      <div class="split-rule">▌ 前向き — 戦略・意思決定</div>
      <ul>
        <li>プロジェクト現状・進捗・WBS</li>
        <li>マイルストーン・スケジュール</li>
        <li>今何をやるか の優先順位決定</li>
        <li>KPI 目標管理</li>
        <li>マネタイズ戦略の検討</li>
      </ul>
    </div>
    <div class="split-item notion-side">
      <div class="split-head">📒 Notion</div>
      <div class="split-rule">▌ 後ろ向き — 実績・記録</div>
      <ul>
        <li>開発ログ・作業メモ</li>
        <li>議事録・Claude との会話記録</li>
        <li>実績・リリース履歴</li>
        <li>調査・リサーチのストック</li>
        <li>ナレッジの蓄積</li>
      </ul>
    </div>
  </div>
  <div class="split-rule-box">
    <strong>判断軸：</strong>「これから何をするか」→ ここ　／　「あの時何をしたか」→ Notion
  </div>
</div>`

/* ── Calendar ── */
h += `<div class="card">
  <h2>📅 カレンダー & マイルストーン</h2>
  <div class="cal-wrap">
    <div class="cal-left">
      <div id="cal-grid-wrap"></div>
    </div>
    <div class="cal-right">
      <div id="cal-ms-wrap"></div>
    </div>
  </div>
</div>`

/* ── OshiPay2 (featured) ── */
const m = D.main
h += `<div class="card ft">
  <h2>🔥 メインプロジェクト &nbsp;<span style="font-weight:400;font-size:.85rem;color:var(--accent)">${m.name}</span></h2>
  <div class="desc">${m.desc}</div>
  <div class="meta">
    <span class="meta-label">📊 進捗</span>
    <div class="meta-bar">
      <div class="pb"><div class="pf-bar" style="width:${m.progress}%"></div></div>
      <div class="pct">${m.progress}%</div>
    </div>
  </div>
  <div class="links">`
m.links.forEach(l => h += `<a href="${l.url}" target="_blank" class="btn ac">${l.label}</a>`)
h += `</div>
  <h3>✅ 実装済み</h3>
  <ul class="done-list">`
m.done.forEach(d => h += `<li>${d}</li>`)
h += `</ul>
  <h3>📋 WBS — 残タスク</h3>`
m.wbs.forEach((ep,ei) => {
  h += `<div class="acc">
    <div class="acc-hd" onclick="tog('ep${ei}')">
      <span class="acc-title"><span class="arr" id="ar-ep${ei}">▶</span> ${ep.label}</span>
      <span class="${ep.prClass}">${ep.prLabel}</span>
    </div>
    <div class="acc-body" id="ep${ei}">`
  ep.tasks.forEach(t => h += `<div class="wt">
    ${dotH(t.st)}
    <div class="wt-body">
      <div class="wt-name"><span class="wt-id">[${t.id}]</span>${t.name}</div>
      <div class="wt-detail">${t.detail}</div>
    </div>
    ${prH(t.pr)}
  </div>`)
  h += `</div></div>`
})
h += `</div>` // end featured

/* ── Heroes requirements ── */
if (D.heroes) {
  const hs = D.heroes
  h += `<div class="card">
    <h2>📋 動画・SNS 伴走 — 全額返金の期限と出口設計</h2>
    <div class="hr-warn">⚠️ ${hs.warn}</div>
    ${hs.capacity?`<div class="hr-cap">${hs.capacity}</div>`:""}
    <div class="hr-grid">`
  hs.reqs.forEach(r => h += `<div class="hr-item">
    <div class="hr-hd"><span>${r.icon}</span>${r.label}</div>
    <div class="hr-rule">${r.rule}</div>
    <div class="hr-total">${r.total}</div>
    <div class="hr-risk">${r.risk}</div>
  </div>`)
  h += `</div>
    <div class="hr-verdict">💡 ${hs.verdict}</div>
  </div>`
}

/* ── ベンチマーク候補 ── */
if (D.bench) {
  const bc = D.bench
  h += `<div class="card">
    <h2>🎯 ベンチマーク候補 — 型にする1本を選ぶ</h2>
    <div class="hr-cap">${bc.note}</div>`
  bc.groups.forEach(g => {
    h += `<h3>${g.label}</h3><div class="links" style="flex-direction:column;gap:6px">`
    g.items.forEach(it => h += `<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
      <a class="btn ac" href="${it.url}" target="_blank">${it.name}</a>
      <span style="font-size:.75rem;color:var(--sub)">${it.memo}</span>
    </div>`)
    h += `</div>`
  })
  h += `<div class="hr-verdict">💡 ${bc.fit}</div>
  </div>`
}

/* ── 2ヶ月の企画：AIドラマ ── */
if (D.drama) {
  const dr = D.drama
  h += `<div class="card ft">
    <h2>🎬 2ヶ月の企画 — AIショートドラマ</h2>
    <div class="hr-cap">${dr.concept}</div>
    <div class="hr-warn">${dr.template}</div>
    <h3>アプリ別の適性とエピソード案</h3>
    <div class="hr-grid">`
  dr.apps.forEach(a => h += `<div class="hr-item">
    <div class="hr-hd"><span>${a.fit}</span>${a.name}</div>
    <div class="hr-risk">${a.why}</div>
    ${a.eps.length ? `<div class="hr-total">エピソード案：${a.eps.map(e => "「" + e + "」").join(" / ")}</div>` : ""}
  </div>`)
  h += `</div>
    <div class="hr-verdict">${dr.rule}</div>
  </div>`
}

/* ── 月5万 ロードマップ ── */
if (D.income) {
  const ic = D.income
  h += `<div class="card ft">
    <h2>💴 月5万 ロードマップ — どこで作るか</h2>
    <div class="inc-hd-row">
      <span class="inc-goal">${ic.goal}</span>
      <span class="inc-deadline">🗓 ${ic.deadline}</span>
    </div>
    <div class="inc-head">${ic.headline}</div>
    <div class="inc-grid">`
  ic.routes.forEach(r => h += `<div class="inc-item ${r.cls}">
    <div class="inc-name">${r.name}</div>
    <div class="inc-reach">${r.reach}</div>
    <div class="inc-need">${r.need}</div>
    <div class="inc-body">${r.body}</div>
  </div>`)
  h += `</div>
    <div class="inc-plan">${ic.plan}</div>
    <div class="inc-risk">${ic.risk}</div>
  </div>`
}

/* ── SNS baseline ── */
if (D.sns) {
  const sn = D.sns
  h += `<div class="card">
    <h2>📣 SNS 現況 — 11/30 判断のベースライン</h2>
    <span class="sns-baseline">📌 基準日 ${sn.baselineDate}（合計フォロワー ${sn.total.toLocaleString()}）</span>
    <div class="sns-note">${sn.note}</div>
    <div class="sns-grid">`
  ;[...sn.accounts, ...(sn.accountsYT||[])].forEach(a => {
    h += `<div class="sns-acc">
      <div class="sns-acc-hd">
        <div>
          <div class="sns-acc-name">${a.name}</div>
          <div class="sns-acc-url">${a.url}</div>
        </div>
        <a href="${a.url}" target="_blank" class="btn ac">Open →</a>
      </div>
      <div class="sns-metrics">`
    a.metrics.forEach(mt => h += `<div class="sns-metric">
      <div class="sns-metric-k">${mt.k}</div>
      <div class="sns-metric-v">${mt.v}</div>
    </div>`)
    h += `</div><div class="sns-memo">${a.memo}</div></div>`
  })
  h += `</div>
    <div class="sns-verdict">⚖️ ${sn.verdict}</div>
  </div>`
}

/* ── Portfolio ── */
if (D.portfolio) {
  const pf = D.portfolio
  h += `<div class="card">
    <h2>📦 公開実績（ポートフォリオ）</h2>
    <div class="pf-note">${pf.note}</div>
    <div class="pf-stats">`
  pf.stats.forEach(s => h += `<div class="pf-stat">
    <div class="pf-stat-lbl">${s.lbl}</div>
    <div class="pf-stat-val">${s.val}</div>
    <div class="pf-stat-sub">${s.sub}</div>
  </div>`)
  h += `</div><div class="pf-links">`
  pf.links.forEach(l => h += `<a class="pf-link" href="${l.url}" target="_blank">
    <div class="pf-link-lbl">${l.label} →</div>
    <div class="pf-link-desc">${l.desc}</div>
    <div class="pf-link-url">${l.url}</div>
  </a>`)
  h += `</div></div>`
}

/* ── Projects overview ── */
h += `<div class="card"><h2>🚀 プロジェクト全体像</h2>`
D.projects.forEach(p => {
  h += `<div class="proj">
    <div class="proj-hd">
      <div class="proj-name">${p.name}</div>
      <div class="proj-right">
        <span class="badge ${p.status}">${SL[p.status]}</span>
        ${p.link?`<a href="${p.link}" target="_blank" class="btn">Open →</a>`:""}
      </div>
    </div>
    <div class="desc">${p.desc}</div>`
  if (p.subs && p.subs.length) {
    h += `<div class="sub-items">`
    p.subs.forEach(s => h += `<div class="sub-item">${s}</div>`)
    h += `</div>`
  }
  h += `<div class="pb"><div class="pf-bar" style="width:${p.progress}%"></div></div></div>`
})
h += `</div>`

/* ── Sub WBS ── */
h += `<div class="card"><h2>📋 サブプロジェクト WBS</h2><div class="sub-grid">`
D.subWbs.forEach(sp => {
  h += `<div class="sub-card"><h4>${sp.icon} ${sp.project}</h4>`
  sp.tasks.forEach(t => h += `<div class="st">${dotH("todo")}<span class="st-name">${t.name}</span>${prH(t.pr)}</div>`)
  h += `</div>`
})
h += `</div></div>`

/* ── Focus ── */
h += `<div class="card"><h2>🎯 現在の最重要フォーカス</h2><ul class="fl">`
D.focus.forEach(f => h += `<li>${f}</li>`)
h += `</ul></div>`

/* ── KPI ── */
h += `<div class="card"><h2>📊 追うべき KPI</h2><div class="kpi-grid">`
D.kpi.forEach(k => h += `<div class="kpi-item">
  <div class="kpi-lbl">${k.lbl}</div>
  <div class="kpi-val">${k.val}</div>
  <div class="kpi-tgt">目標: ${k.tgt}</div>
</div>`)
h += `</div></div>`

app.innerHTML = h

// ── Init ──
initCal()
renderCalendar()

// Accordion default open: Epic A, B
;["ep0","ep1"].forEach(id => {
  const b = document.getElementById(id)
  const a = document.getElementById("ar-"+id)
  if (b) b.style.display="block"
  if (a) a.classList.add("open")
})

function tog(id) {
  const b = document.getElementById(id)
  const a = document.getElementById("ar-"+id)
  const o = b.style.display==="block"
  b.style.display = o?"none":"block"
  if (a) a.classList.toggle("open",!o)
}
</script>
</body>
</html>
